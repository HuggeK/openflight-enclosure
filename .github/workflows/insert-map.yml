name: Insert map

# Regenerates the hole data from the STLs and publishes the 3D insert map to GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "stls/**"
      - "docs/viewer/**"
      - "tools/insert-map/**"
      - ".github/workflows/insert-map.yml"
  pull_request:
    paths:
      - "stls/**"
      - "docs/viewer/**"
      - "tools/insert-map/**"
      - ".github/workflows/insert-map.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: insert-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  holes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/insert-map/requirements.txt
      - run: pip install -r tools/insert-map/requirements.txt
      - name: Find holes in every STL
        run: python tools/insert-map/analyze.py
      - name: Report hole changes
        run: |
          {
            echo "## Insert map"
            if git diff --quiet -- docs/viewer/data/holes.json; then
              echo "docs/viewer/data/holes.json matches the STLs."
            else
              echo "The STLs changed the hole data. Run \`python tools/insert-map/analyze.py\` and commit \`docs/viewer/data/holes.json\` to update it."
              echo
              echo '```diff'
              git diff --stat -- docs/viewer/data/holes.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/viewer _site/viewer
          cp -r stls _site/stls
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=viewer/"><a href="viewer/">Insert map</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: holes
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
